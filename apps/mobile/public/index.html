<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      This file replaces Expo's default web template (`expo export` reads
      public/index.html when it exists; see @expo/cli's webTemplate.js). It is
      the default template plus ONE addition: a loading splash BEHIND #root.

      Why: the web app is a single multi-megabyte script, and nothing paints
      until it has downloaded and run. On a slow phone connection that was a
      blank white page for many seconds (Dev2, 2026-11-08: "slow in low data
      or slow wifi situations, white screen"). The splash is plain HTML and
      CSS, so it shows the moment this page arrives.

      It sits BEHIND #root (fixed, lower z-index) rather than inside it, and
      that is deliberate. The web build splits each route into its own chunk
      (app.config.js, asyncRoutes), and while a route's chunk downloads Expo
      Router renders nothing for it. A splash inside #root would be replaced by
      React's first render and leave those gaps blank again; behind #root it
      shows through every gap, at startup and on in-app navigation, and every
      real screen (AppShell, login, Screen — all opaque `bg-surface`) covers it.
      Keep it dependency-free: no images, fonts or scripts to wait on.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="boot-splash-style">
      /* Colours are lib/theme.ts's cream (page background), ink and brand500. */
      body {
        margin: 0;
        background: #fdf6f6;
      }
      #root {
        position: relative;
        z-index: 1;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #210909;
      }
      .boot-splash__spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #f2d2d2;
        border-top-color: #d23b3a;
        animation: boot-splash-spin 0.9s linear infinite;
      }
      .boot-splash__label {
        font-size: 14px;
        opacity: 0.7;
      }
      /* Until React has rendered anything, the empty #root must not swallow
         taps meant for the splash's Reload button underneath it. */
      #root:empty {
        pointer-events: none;
      }
      .boot-splash__slow {
        max-width: 300px;
        padding: 0 24px;
        text-align: center;
        font-size: 13px;
        line-height: 1.45;
      }
      #boot-splash-slow-msg {
        opacity: 0.8;
      }
      .boot-splash__slow[hidden] {
        display: none;
      }
      .boot-splash__reload {
        margin-top: 12px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #d23b3a;
        color: #ffffff;
        font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div class="boot-splash" id="boot-splash">
      <div class="boot-splash__spinner" aria-hidden="true"></div>
      <div class="boot-splash__label" role="status">Loading Chapter OS…</div>
      <div class="boot-splash__slow" id="boot-splash-slow" role="alert" hidden>
        <div id="boot-splash-slow-msg"></div>
        <button class="boot-splash__reload" type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!--
      THE STALL FALLBACK. The splash alone still left a weak connection
      staring at a spinner for minutes with no idea whether anything was
      happening (Dev2, 2026-11-10: /os/code from a Gmail link on one bar of
      cellular). Plain inline JS — it has to work while the app's own script is
      the thing that hasn't arrived:
       - 15 s with nothing rendered → say the download is slow, offer Reload;
       - an app script that fails to load → say so at once, offer Reload;
       - once React renders into #root, hide the splash from assistive tech
         (it stays in the DOM behind the app, covered by every screen).
      React's own BootSplash takes over from here for sign-in and profile.
    -->
    <script>
      (function () {
        var root = null;
        var shown = false;
        function booted() {
          root = root || document.getElementById("root");
          return !!(root && root.firstChild);
        }
        function show(msg) {
          if (booted()) return;
          var box = document.getElementById("boot-splash-slow");
          var text = document.getElementById("boot-splash-slow-msg");
          if (!box || !text) return;
          text.textContent = msg;
          box.hidden = false;
          shown = true;
        }
        setTimeout(function () {
          if (!shown) {
            show("Still downloading the app — your connection looks slow. It opens as soon as the download finishes, or try reloading.");
          }
        }, 15000);
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            if (t && t.tagName === "SCRIPT") {
              show("The app didn't finish downloading. Check your connection and reload.");
            }
          },
          true
        );
        if (typeof MutationObserver === "function") {
          var obs = new MutationObserver(function () {
            if (booted()) {
              var splash = document.getElementById("boot-splash");
              if (splash) splash.setAttribute("aria-hidden", "true");
              var box = document.getElementById("boot-splash-slow");
              if (box) box.hidden = true;
              obs.disconnect();
            }
          });
          // #root is above this script, so it already exists; the app's
          // own (deferred) scripts render into it later.
          var r = document.getElementById("root");
          if (r) obs.observe(r, { childList: true });
        }
      })();
    </script>
  </body>
</html>
