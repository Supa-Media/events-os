<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      This file replaces Expo's default web template (`expo export` reads
      public/index.html when it exists; see @expo/cli's webTemplate.js). It is
      the default template plus ONE addition: a loading splash BEHIND #root.

      Why: the web app is a single multi-megabyte script, and nothing paints
      until it has downloaded and run. On a slow phone connection that was a
      blank white page for many seconds (Dev2, 2026-11-08: "slow in low data
      or slow wifi situations, white screen"). The splash is plain HTML and
      CSS, so it shows the moment this page arrives.

      It sits BEHIND #root (fixed, lower z-index) rather than inside it, and
      that is deliberate. The web build splits each route into its own chunk
      (app.config.js, asyncRoutes), and while a route's chunk downloads Expo
      Router renders nothing for it. A splash inside #root would be replaced by
      React's first render and leave those gaps blank again; behind #root it
      shows through every gap, at startup and on in-app navigation, and every
      real screen (AppShell, login, Screen — all opaque `bg-surface`) covers it.
      Keep it dependency-free: no images, fonts or scripts to wait on.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="boot-splash-style">
      /* Colours are lib/theme.ts's cream (page background), ink and brand500. */
      body {
        margin: 0;
        background: #fdf6f6;
      }
      #root {
        position: relative;
        z-index: 1;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #210909;
      }
      .boot-splash__spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #f2d2d2;
        border-top-color: #d23b3a;
        animation: boot-splash-spin 0.9s linear infinite;
      }
      .boot-splash__label {
        font-size: 14px;
        opacity: 0.7;
      }
      /* Until React has rendered anything, the empty #root must not swallow
         taps meant for the splash's Reload button underneath it. */
      #root:empty {
        pointer-events: none;
      }
      .boot-splash__slow {
        max-width: 300px;
        padding: 0 24px;
        text-align: center;
        font-size: 13px;
        line-height: 1.45;
      }
      #boot-splash-slow-msg {
        opacity: 0.8;
      }
      /* What was going on when it stalled — so a screenshot is a bug report. */
      .boot-splash__detail {
        margin-top: 8px;
        font: 11px ui-monospace, Menlo, monospace;
        opacity: 0.55;
        word-break: break-word;
      }
      .boot-splash__slow[hidden] {
        display: none;
      }
      .boot-splash__reload {
        margin-top: 12px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #d23b3a;
        color: #ffffff;
        font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div class="boot-splash" id="boot-splash">
      <div class="boot-splash__spinner" aria-hidden="true"></div>
      <div class="boot-splash__label" role="status">Loading Chapter OS…</div>
      <div class="boot-splash__slow" id="boot-splash-slow" role="alert" hidden>
        <div id="boot-splash-slow-msg"></div>
        <div id="boot-splash-slow-detail" class="boot-splash__detail"></div>
        <button class="boot-splash__reload" type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!--
      THE STALL FALLBACK. The splash alone still left a weak connection
      staring at a spinner for minutes with no idea whether anything was
      happening (Dev2, 2026-11-10: /os/code from a Gmail link on one bar of
      cellular). Plain inline JS — it has to work while the app's own script is
      the thing that hasn't arrived:
       - 15 s with nothing on screen (no text in #root — React may have
         mounted and still be stuck on an empty route gap) → say so, offer
         Reload, and print the last error and last script loaded so a
         screenshot says WHY;
       - an app script that fails to load → say so at once;
       - once the app shows something, hide the message and hide the splash
         from assistive tech (it stays behind the app, covered by every
         screen).
      React's own BootSplash takes over from here for sign-in and profile.
    -->
    <script>
      (function () {
        var errors = [];
        var shown = false;
        var root = document.getElementById("root");
        // "Rendered" means the app is SHOWING something, not merely that
        // React mounted: while a route's chunk loads (or if it never does),
        // #root holds empty wrappers and the page looks exactly like this
        // splash. Text is the honest test — every real screen and the React
        // BootSplash have some.
        function showing() {
          return !!(root && (root.innerText || root.textContent || "").trim());
        }
        function detail() {
          var parts = [];
          if (errors.length) parts.push("Error: " + errors[errors.length - 1]);
          try {
            var js = performance.getEntriesByType("resource").filter(function (r) {
              return /\.js(\?|$)/.test(r.name);
            });
            parts.push(js.length + " app files loaded");
            if (js.length) parts.push("last: " + js[js.length - 1].name.split("/").pop());
          } catch (e) {}
          parts.push(Math.round(performance.now() / 1000) + "s");
          return parts.join(" · ");
        }
        function show(msg) {
          if (showing()) return;
          var box = document.getElementById("boot-splash-slow");
          var text = document.getElementById("boot-splash-slow-msg");
          var info = document.getElementById("boot-splash-slow-detail");
          if (!box || !text) return;
          text.textContent = msg;
          if (info) info.textContent = detail();
          box.hidden = false;
          shown = true;
        }
        function hideIfShowing() {
          if (!showing()) return;
          var box = document.getElementById("boot-splash-slow");
          if (box) box.hidden = true;
          var splash = document.getElementById("boot-splash");
          if (splash) splash.setAttribute("aria-hidden", "true");
        }
        // Checked repeatedly, not once: the app can render, then sit on an
        // empty route gap that never fills.
        setInterval(function () {
          if (showing()) return hideIfShowing();
          if (performance.now() > 15000) {
            show(
              errors.length
                ? "The app hit an error while starting. Try reloading."
                : "The app is taking too long to open. Try reloading."
            );
          }
        }, 1000);
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
              errors.push("couldn't load " + String(t.src || t.href).split("/").pop());
              show("The app didn't finish downloading. Check your connection and reload.");
            } else if (e && e.message) {
              errors.push(String(e.message).slice(0, 160));
            }
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          errors.push(String((r && (r.message || r)) || "unhandled rejection").slice(0, 160));
        });
      })();
    </script>
  </body>
</html>
