# =====================================================================
# IMPORTANT LINKS — homepage Links section
# =====================================================================
# THE OS IS THE SOURCE OF TRUTH. These cards are managed on the Marketing
# desk (Chapter OS → Marketing → Links) and stored in Convex (`siteLinks`).
# The homepage fetches them at runtime from GET /api/site/home and replaces
# the grid built from this file — so a card added, edited, reordered, or
# unpublished in the OS shows up on publicworship.life with no deploy.
#
# WHAT THIS FILE IS NOW: the FALLBACK. It renders at build time and is what a
# visitor sees if the backend is unreachable, and what a crawler sees before
# JS runs. Editing it changes only that. To change the live page, use the OS.
#
# The live event cards are chosen in the OS too (how many, which to lead with,
# which to keep off) — see the "Live events" row on the Links tab.
#
# Fields kept in sync with `siteLinks` / `PublicSiteLink`:
#   id, title, url | subtitle, thumbnail, bgImage, cta, copy, align, slot
# =====================================================================
- id: give
  title: Donate
